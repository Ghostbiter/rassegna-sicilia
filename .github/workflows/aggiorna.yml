name: Aggiorna rassegna
on:
  schedule:
    # GitHub salta spesso le esecuzioni programmate sui progetti gratuiti e la
    # mattina presto non parte quasi mai. Chiediamo a minuti "dispari" (i minuti
    # tondi sono i più affollati) e per tutto il giorno. La sveglia affidabile
    # arriva comunque da fuori: vedi GUIDA-SVEGLIA.md
    - cron: "7,27,47 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: rassegna
  cancel-in-progress: false
jobs:
  aggiorna:
    runs-on: ubuntu-latest
    # un giro normale dura un minuto: se qualcosa si pianta non blocca le raccolte successive
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python bot.py
      - run: |
          git config user.name "rassegna-bot"
          git config user.email "bot@users.noreply.github.com"
          git add docs/data
          git diff --cached --quiet && exit 0
          git commit -m "Rassegna $(date +%F\ %H:%M)"
          # se nel frattempo ha pubblicato il Mac: mi riallineo (tenendo i dati appena raccolti) e riprovo
          for i in 1 2 3; do
            git push && exit 0
            git pull --rebase -X theirs -q origin main || exit 1
          done
          exit 1
