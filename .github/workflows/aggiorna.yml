name: Aggiorna rassegna
on:
  schedule:
    # GitHub salta spesso le esecuzioni programmate sui progetti gratuiti:
    # ne chiediamo una ogni 20 minuti così almeno una per ora va a buon fine.
    - cron: "*/20 4-22 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: rassegna
  cancel-in-progress: false
jobs:
  aggiorna:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python bot.py
      - run: |
          git config user.name "rassegna-bot"
          git config user.email "bot@users.noreply.github.com"
          git add docs/data
          git diff --cached --quiet || (git commit -m "Rassegna $(date +%F\ %H:%M)" && git push)
