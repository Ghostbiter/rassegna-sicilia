name: Aggiorna rassegna
on:
  schedule:
    # GitHub salta spesso le esecuzioni programmate sui progetti gratuiti e la
    # mattina presto non parte quasi mai. Chiediamo a minuti "dispari" (i minuti
    # tondi sono i più affollati) e per tutto il giorno. La sveglia affidabile
    # arriva comunque da fuori: vedi GUIDA-SVEGLIA.md
    - cron: "7,27,47 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: rassegna
  cancel-in-progress: false
jobs:
  aggiorna:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python bot.py
      - run: |
          git config user.name "rassegna-bot"
          git config user.email "bot@users.noreply.github.com"
          git add docs/data
          git diff --cached --quiet || (git commit -m "Rassegna $(date +%F\ %H:%M)" && git push)
